    container_name: takenote_sql_server
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Your_Strong_Password123! # Docker i�indeki DB �ifresi
    ports:
      - "1433:1433"
    volumes:
      - sqlvolume:/var/opt/mssql # Veriler kaybolmas�n diye disk alan�

  # 2. KUTU: Senin API Projen
  takenote-api:
    image: takenote-api
    container_name: takenote_api_container
