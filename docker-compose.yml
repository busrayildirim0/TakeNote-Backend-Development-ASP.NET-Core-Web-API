    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      # D�KKAT: Docker i�indeyken "Server=takenote-db" diyoruz (Localhost de�il!)
      - ConnectionStrings__DefaultConnection=Server=takenote-db;Database=TakeNoteDB;User Id=sa;Password=Your_Strong_Password123!;TrustServerCertificate=True;
      # JWT Ayarlar�n� buradan da verebilirsin (Opsiyonel, appsettings'den okur)
