<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TakeNote - Test Paneli</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/7.0.5/signalr.min.js"></script>
    <style>
        .log-box { height: 300px; overflow-y: scroll; background: #222; color: #0f0; font-family: monospace; padding: 10px; border-radius: 5px; }
        .hidden { display: none; }
    </style>
</head>
<body class="bg-light">

<div class="container mt-5">
    <h1 class="text-center mb-4">📝 TakeNote Test Paneli</h1>

    <div id="loginSection" class="card p-4 shadow-sm mx-auto" style="max-width: 400px;">
        <h4 class="mb-3">Giriş Yap</h4>
        <input type="text" id="email" class="form-control mb-2" placeholder="Email" value="test@test.com">
        <input type="password" id="password" class="form-control mb-2" placeholder="Şifre" value="Password123!">
        <button onclick="login()" class="btn btn-primary w-100">Giriş Yap (Login)</button>
    </div>

    <div id="appSection" class="row hidden">
        
        <div class="col-md-6">
            <div class="card p-3 mb-3">
                <h5>📁 Çalışma Alanları (Workspaces)</h5>
                <button onclick="getWorkspaces()" class="btn btn-sm btn-outline-secondary mb-2">Yenile</button>
                <ul id="workspaceList" class="list-group">
                    <li class="list-group-item text-muted">Henüz listelenmedi...</li>
                </ul>
            </div>

            <div class="card p-3">
                <h5>➕ Yeni Not Ekle</h5>
                <input type="text" id="noteTitle" class="form-control mb-2" placeholder="Not Başlığı">
                <input type="text" id="noteContent" class="form-control mb-2" placeholder="İçerik">
                <input type="number" id="targetWsId" class="form-control mb-2" placeholder="Workspace ID (Boşsa Kişisel)">
                <button onclick="createNote()" class="btn btn-success w-100">Not Oluştur</button>
            </div>
        </div>

        <div class="col-md-6">
            <div class="card p-3">
                <h5>📡 Canlı Akış (SignalR)</h5>
                <div id="signalRStatus" class="badge bg-secondary mb-2">Bağlantı Bekleniyor...</div>
                <div id="logs" class="log-box"></div>
            </div>
        </div>
    </div>
</div>

<script>
    // --- AYARLAR ---
    const API_URL = "https://localhost:7139/api"; // Port numaranı kontrol et!
    const HUB_URL = "https://localhost:7139/collaborationHub";
    
    let token = "";
    let connection = null;

    // --- 1. LOGIN ---
    async function login() {
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        try {
            const res = await fetch(`${API_URL}/Auth/login`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email, password })
            });

            if (!res.ok) throw new Error("Giriş başarısız!");
            
            const data = await res.json();
            token = data.token; // Token'ı sakla
            
            alert("Giriş Başarılı! Hoşgeldin " + data.username);
            document.getElementById("loginSection").classList.add("hidden");
            document.getElementById("appSection").classList.remove("hidden");

            // Otomatik işlemleri başlat
            getWorkspaces();
            startSignalR();

        } catch (err) {
            alert(err.message);
        }
    }

    // --- 2. VERİ ÇEKME ---
    async function getWorkspaces() {
        const res = await fetch(`${API_URL}/Workspace`, {
            headers: { "Authorization": `Bearer ${token}` }
        });
        const data = await res.json();
        
        const list = document.getElementById("workspaceList");
        list.innerHTML = "";
        
        data.forEach(ws => {
            // Listeye tıklandığında o odaya katılalım
            list.innerHTML += `
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    <span>${ws.title} (ID: ${ws.id})</span>
                    <button class="btn btn-sm btn-info" onclick="joinRoom('${ws.id}')">Odaya Katıl</button>
                </li>`;
        });
    }

    // --- 3. NOT EKLEME ---
    async function createNote() {
        const title = document.getElementById("noteTitle").value;
        const content = document.getElementById("noteContent").value;
        const wsIdVal = document.getElementById("targetWsId").value;
        const workspaceId = wsIdVal ? parseInt(wsIdVal) : null;

        const body = { title, content, workspaceId, isPinned: false };

        const res = await fetch(`${API_URL}/Note`, {
            method: "POST",
            headers: { 
                "Authorization": `Bearer ${token}`,
                "Content-Type": "application/json"
            },
            body: JSON.stringify(body)
        });

        if (res.ok) log("✅ Not başarıyla gönderildi!");
        else log("❌ Hata oluştu!");
    }

    // --- 4. SIGNALR ---
    function startSignalR() {
        connection = new signalr.HubConnectionBuilder()
            .withUrl(HUB_URL, { accessTokenFactory: () => token }) // Token ile bağlanıyoruz
            .build();

        connection.on("ReceiveNewNote", (note) => {
            log(`🔔 [CANLI BİLDİRİM] Yeni Not: ${note.title} (ID: ${note.id})`);
        });

        connection.on("ReceiveNoteUpdate", (id, dto) => {
            log(`✏️ [GÜNCELLEME] Not ID: ${id} güncellendi.`);
        });

        connection.start()
            .then(() => {
                document.getElementById("signalRStatus").className = "badge bg-success";
                document.getElementById("signalRStatus").innerText = "SignalR Bağlandı 🟢";
                log("SignalR bağlantısı kuruldu.");
            })
            .catch(err => log("SignalR Hatası: " + err));
    }

    function joinRoom(wsId) {
        connection.invoke("JoinWorkspaceGroup", wsId.toString())
            .then(() => log(`➡️ Workspace_${wsId} odasına katıldın.`))
            .catch(err => log("Odaya katılma hatası: " + err));
    }

    function log(message) {
        const box = document.getElementById("logs");
        box.innerHTML += `<div>> ${message}</div>`;
        box.scrollTop = box.scrollHeight;
    }
</script>

</body>
</html>
